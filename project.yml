# XcodeGen spec — run `xcodegen generate` from this directory to produce GravityWallpaper.xcodeproj
name: GravityWallpaper

options:
  bundleIdPrefix: com.universe-screen
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

targets:
  GravityWallpaper:
    type: application
    platform: macOS
    deploymentTarget: "26.0"

    sources:
      - path: Sources
        excludes: []
      - path: Resources
        type: folder
        buildPhase: resources
        excludes:
          - Info.plist
          - GravityWallpaper.entitlements

    settings:
      base:
        PRODUCT_NAME: Universe Screen
        PRODUCT_BUNDLE_IDENTIFIER: com.josiah.universe-screen.sol
        INFOPLIST_KEY_LSUIElement: YES               # hide from Dock
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleName: Universe Screen
        INFOPLIST_KEY_CFBundleDisplayName: Universe Screen
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/GravityWallpaper.entitlements
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
      configs:
        Debug:
          METAL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        Release:
          METAL_ENABLE_DEBUG_INFO: NO

    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleName: Universe Screen
        CFBundleDisplayName: Universe Screen
        CFBundleIdentifier: com.josiah.universe-screen.sol
        CFBundleVersion: "2"
        CFBundleShortVersionString: "2.0"
        NSHighResolutionCapable: true
        NSAppleEventsUsageDescription: "Universe Screen can read Finder icon positions when your selected source is the Desktop."

  UniverseScreenTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    dependencies:
      - target: GravityWallpaper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josiah.universe-screen.sol.tests
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Universe Screen.app/Contents/MacOS/Universe Screen"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  GravityWallpaper:
    build:
      targets:
        GravityWallpaper: all
        UniverseScreenTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: UniverseScreenTests
